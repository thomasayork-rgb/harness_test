[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "Minimal ReAct agent runtime: lazy toolbelt, todo gate, think-before-act, trajectory export"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["skills_bundled/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
